# Netlify — Smart'Q frontend (static React build)
# Site settings → Build & deploy → use these values (or keep this file at repo root).

[build]
  base = "frontend"
  command = "npm ci && node -e \"console.log('[Netlify build] REACT_APP_API_URL=', process.env.REACT_APP_API_URL || '(not set — use Netlify env or public/smartq-config.js)')\" && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: client-side routing / refresh on deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
